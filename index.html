<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Liar</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: #f5f3ef;
    color: #1a1a1a;
    font-family: 'DM Sans', sans-serif;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
  }

  .app { width: 100%; max-width: 430px; position: relative; }

  .screen { padding: 16px 14px 40px; }
  .screen.hidden { display: none; }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 20px;
    padding: 6px 0 10px;
  }

  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 34px;
    font-weight: 500;
    color: #1a1a1a;
    line-height: 1;
    letter-spacing: -.01em;
  }

  .header-left h1 em { font-style: italic; font-weight: 400; }

  .header-left p {
    font-size: 11px;
    color: #999;
    margin-top: 5px;
    font-family: 'DM Mono', monospace;
    letter-spacing: .04em;
  }

  .settings-btn {
    background: none;
    border: 0.5px solid #ddd;
    border-radius: 8px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #aaa;
    margin-top: 4px;
    flex-shrink: 0;
  }

  .settings-btn:active { background: #f0ede8; }

  .card {
    background: #fff;
    border: 0.5px solid #e5e2dc;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }

  .card-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: #aaa;
    margin-bottom: 12px;
    font-family: 'DM Mono', monospace;
  }

  .die-row { display: flex; gap: 7px; flex-wrap: wrap; }

  .die {
    width: 50px;
    height: 50px;
    border: 0.5px solid #ddd;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    cursor: pointer;
    background: #faf9f7;
    user-select: none;
    transition: transform .08s;
  }

  .die:active { transform: scale(.92); background: #f0ede8; }

  .field-label {
    font-size: 11px;
    color: #888;
    margin-bottom: 7px;
    font-family: 'DM Mono', monospace;
  }

  .stepper { display: flex; align-items: center; }

  .step-btn {
    width: 44px;
    height: 44px;
    border: 0.5px solid #ddd;
    background: #faf9f7;
    color: #1a1a1a;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  .step-btn:first-child { border-radius: 8px 0 0 8px; }
  .step-btn:last-child { border-radius: 0 8px 8px 0; }
  .step-btn:active { background: #f0ede8; }

  .step-val {
    min-width: 44px;
    height: 44px;
    border-top: 0.5px solid #ddd;
    border-bottom: 0.5px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 500;
    background: #fff;
    color: #1a1a1a;
    font-family: 'DM Mono', monospace;
  }

  .face-grid { display: flex; gap: 7px; flex-wrap: wrap; }

  .face-btn {
    width: 46px;
    height: 46px;
    border: 0.5px solid #ddd;
    border-radius: 8px;
    background: #faf9f7;
    color: #1a1a1a;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    transition: transform .08s;
  }

  .face-btn.active {
    border: 1.5px solid #185FA5;
    background: #E6F1FB;
  }

  .face-btn:active { transform: scale(.91); }

  .verdict-card {
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }

  .verdict-good { background: #EAF3DE; border: 0.5px solid #97C459; }
  .verdict-risky { background: #FAEEDA; border: 0.5px solid #EF9F27; }
  .verdict-bad { background: #FCEBEB; border: 0.5px solid #F09595; }

  .verdict-title { font-size: 17px; font-weight: 500; margin-bottom: 2px; }
  .verdict-good .verdict-title { color: #27500A; }
  .verdict-risky .verdict-title { color: #633806; }
  .verdict-bad .verdict-title { color: #791F1F; }

  .verdict-sub { font-size: 13px; }
  .verdict-good .verdict-sub { color: #3B6D11; }
  .verdict-risky .verdict-sub { color: #854F0B; }
  .verdict-bad .verdict-sub { color: #A32D2D; }

  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }

  .stat {
    background: #fff;
    border: 0.5px solid #e5e2dc;
    border-radius: 8px;
    padding: 10px 12px;
  }

  .stat-label {
    font-size: 10px;
    color: #aaa;
    margin-bottom: 4px;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: .06em;
  }

  .stat-val {
    font-size: 26px;
    font-weight: 500;
    color: #1a1a1a;
    font-family: 'DM Mono', monospace;
  }

  .bar-wrap {
    height: 4px;
    background: #f0ede8;
    border-radius: 2px;
    overflow: hidden;
    margin-top: 7px;
  }

  .bar { height: 100%; border-radius: 2px; transition: width .35s ease; }

  .raise-box {
    background: #fff;
    border: 0.5px solid #e5e2dc;
    border-radius: 8px;
    padding: 10px 14px;
  }

  .raise-label {
    font-size: 10px;
    color: #aaa;
    margin-bottom: 3px;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: .06em;
  }

  .raise-val { font-size: 14px; font-weight: 500; color: #1a1a1a; }
  .raise-sub { font-size: 12px; color: #888; margin-top: 2px; }

  .settings-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    padding: 6px 0 10px;
  }

  .back-btn {
    background: none;
    border: 0.5px solid #ddd;
    border-radius: 8px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #888;
    flex-shrink: 0;
  }

  .back-btn:active { background: #f0ede8; }

  .settings-title {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 500;
    color: #1a1a1a;
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 0.5px solid #e5e2dc;
  }

  .setting-row:last-child { border-bottom: none; }
  .setting-label { font-size: 15px; color: #1a1a1a; }
  .setting-sub { font-size: 12px; color: #aaa; margin-top: 2px; }
</style>
</head>
<body>
<div class="app">

  <!-- Main screen -->
  <div class="screen" id="main-screen">
    <header>
      <div class="header-left">
        <h1><em>Liar</em></h1>
        <p>ones always wild</p>
      </div>
      <button class="settings-btn" onclick="showSettings()" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="8" cy="8" r="2.5"/>
          <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.05 3.05l1.06 1.06M11.89 11.89l1.06 1.06M3.05 12.95l1.06-1.06M11.89 4.11l1.06-1.06"/>
        </svg>
      </button>
    </header>

    <div class="card">
      <div class="card-label">My dice — tap to cycle</div>
      <div class="die-row" id="dice-row"></div>
    </div>

    <div class="card">
      <div class="field-label" style="margin-bottom:10px;">Total dice in play</div>
      <div class="stepper" style="width:fit-content;">
        <button class="step-btn" onclick="adj('total',-1)">−</button>
        <div class="step-val" id="total-val">20</div>
        <button class="step-btn" onclick="adj('total',1)">+</button>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Current bid</div>
      <div style="margin-bottom:14px;">
        <div class="field-label">Quantity</div>
        <div class="stepper">
          <button class="step-btn" onclick="adj('qty',-1)">−</button>
          <div class="step-val" id="qty-val">4</div>
          <button class="step-btn" onclick="adj('qty',1)">+</button>
        </div>
      </div>
      <div>
        <div class="field-label">Face</div>
        <div class="face-grid" id="bid-face-row"></div>
      </div>
    </div>

    <div id="result-area"></div>
  </div>

  <!-- Settings screen -->
  <div class="screen hidden" id="settings-screen">
    <div class="settings-header">
      <button class="back-btn" onclick="showMain()" aria-label="Back">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 3L5 8l5 5"/>
        </svg>
      </button>
      <div class="settings-title">Settings</div>
    </div>
    <div class="card">
      <div class="setting-row">
        <div>
          <div class="setting-label">My dice count</div>
          <div class="setting-sub">How many dice you're rolling</div>
        </div>
        <div class="stepper">
          <button class="step-btn" onclick="adjDice(-1)">−</button>
          <div class="step-val" id="dice-count-val">6</div>
          <button class="step-btn" onclick="adjDice(1)">+</button>
        </div>
      </div>
    </div>
  </div>

</div>
<script>
const PIPS = ['⚀','⚁','⚂','⚃','⚄','⚅'];
let myDice = [1,1,1,1,1,1];
let total = 20, bidQty = 4, bidFace = 3;

function showSettings() {
  document.getElementById('main-screen').classList.add('hidden');
  document.getElementById('settings-screen').classList.remove('hidden');
}

function showMain() {
  document.getElementById('settings-screen').classList.add('hidden');
  document.getElementById('main-screen').classList.remove('hidden');
}

function adjDice(d) {
  const n = Math.max(1, Math.min(6, myDice.length + d));
  while (myDice.length < n) myDice.push(1);
  myDice = myDice.slice(0, n);
  if (total < myDice.length) total = myDice.length;
  document.getElementById('dice-count-val').textContent = myDice.length;
  document.getElementById('total-val').textContent = total;
  renderDice(); calc();
}

function renderDice() {
  const row = document.getElementById('dice-row');
  row.innerHTML = '';
  myDice.forEach((v, i) => {
    const d = document.createElement('div');
    d.className = 'die';
    d.textContent = PIPS[v - 1];
    d.onclick = () => { myDice[i] = (myDice[i] % 6) + 1; renderDice(); calc(); };
    row.appendChild(d);
  });
}

function adj(k, d) {
  if (k === 'total') { total = Math.max(myDice.length, Math.min(30, total + d)); document.getElementById('total-val').textContent = total; }
  if (k === 'qty') { bidQty = Math.max(1, Math.min(30, bidQty + d)); document.getElementById('qty-val').textContent = bidQty; }
  calc();
}

function buildFaceRow() {
  const row = document.getElementById('bid-face-row');
  row.innerHTML = '';
  for (let f = 1; f <= 6; f++) {
    const b = document.createElement('div');
    b.className = 'face-btn' + (f === bidFace ? ' active' : '');
    b.textContent = PIPS[f - 1];
    b.onclick = () => { bidFace = f; buildFaceRow(); calc(); };
    row.appendChild(b);
  }
}

function binom(n, k, p) {
  if (k > n || k < 0) return 0;
  if (p <= 0) return k === 0 ? 1 : 0;
  if (p >= 1) return 1;
  let log = 0;
  for (let i = 0; i < k; i++) log += Math.log(n - i) - Math.log(i + 1);
  log += k * Math.log(p) + (n - k) * Math.log(1 - p);
  return Math.exp(log);
}

function probAtLeast(n, k, p) {
  if (k <= 0) return 1;
  if (k > n) return 0;
  let t = 0;
  for (let i = k; i <= n; i++) t += binom(n, i, p);
  return Math.min(1, Math.max(0, t));
}

function calc() {
  const unknown = Math.max(0, total - myDice.length);
  const p = bidFace === 1 ? 1/6 : 2/6;
  const myCount = myDice.filter(v => v === bidFace || v === 1).length;
  const needed = Math.max(0, bidQty - myCount);
  const probTrue = probAtLeast(unknown, needed, p);
  const probLie = 1 - probTrue;
  const raiseNeeded = Math.max(0, (bidQty + 1) - myCount);
  const probRaiseTrue = probAtLeast(unknown, raiseNeeded, p);

  let vClass, vTitle, vSub;
  if (probLie >= 0.55) { vClass = 'verdict-good'; vTitle = 'Call the bluff'; vSub = `${(probLie*100).toFixed(0)}% chance it's a lie`; }
  else if (probLie >= 0.38) { vClass = 'verdict-risky'; vTitle = 'Coin flip — your call'; vSub = `${(probLie*100).toFixed(0)}% chance it's a lie`; }
  else { vClass = 'verdict-bad'; vTitle = 'Let it ride'; vSub = `Only ${(probLie*100).toFixed(0)}% chance it's a lie`; }

  const raiseDesc = probRaiseTrue >= 0.55 ? 'solid raise' : probRaiseTrue >= 0.35 ? 'defensible bluff' : 'big bluff territory';

  document.getElementById('result-area').innerHTML = `
    <div class="verdict-card ${vClass}">
      <div class="verdict-title">${vTitle}</div>
      <div class="verdict-sub">${vSub}</div>
    </div>
    <div class="stats-row">
      <div class="stat"><div class="stat-label">Bid true</div><div class="stat-val">${(probTrue*100).toFixed(0)}%</div><div class="bar-wrap"><div class="bar" style="width:${(probTrue*100).toFixed(0)}%;background:#378ADD;"></div></div></div>
      <div class="stat"><div class="stat-label">Bid a lie</div><div class="stat-val">${(probLie*100).toFixed(0)}%</div><div class="bar-wrap"><div class="bar" style="width:${(probLie*100).toFixed(0)}%;background:#5a8f4e;"></div></div></div>
    </div>
    <div class="raise-box">
      <div class="raise-label">Raise to ${bidQty+1} × ${PIPS[bidFace-1]}</div>
      <div class="raise-val">${(probRaiseTrue*100).toFixed(0)}% chance your raise is true</div>
      <div class="raise-sub">${raiseDesc}</div>
    </div>`;
}

renderDice(); buildFaceRow(); calc();
</script>
</body>
</html>
