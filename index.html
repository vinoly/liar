<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Liar</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: #f5f3ef;
    color: #1a1a1a;
    font-family: 'DM Sans', sans-serif;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
  }

  .app { width: 100%; max-width: 390px; }
  .screen { padding: 10px 12px 16px; }
  .screen.hidden { display: none; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 6px 0; }
  .header-center { flex: 1; display: flex; justify-content: center; }
  .header-spacer { width: 32px; flex-shrink: 0; }

  .settings-btn { background: none; border: 0.5px solid #bbb; border-radius: 7px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #aaa; flex-shrink: 0; }
  .settings-btn:active { background: #f0ede8; }

  .card { background: #fff; border: 0.5px solid #ccc; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .card-label { font-size: 10px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: #aaa; margin-bottom: 8px; font-family: 'DM Mono', monospace; }

  .die, .face-btn { width: 48px; height: 48px; flex-shrink: 0; border: 1px solid #bbb; border-radius: 7px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #faf9f7; user-select: none; transition: transform .08s; padding: 5px; }
  .die svg, .face-btn svg { width: 100%; height: 100%; display: block; }
  .die:active, .face-btn:active { transform: scale(.92); background: #f0ede8; }
  .face-btn.active { border: 2px solid #185FA5; background: #E6F1FB; }

  .die-row { display: flex; gap: 5px; justify-content: space-between; }
  .face-grid { display: grid; grid-template-columns: repeat(3, 48px); gap: 5px; justify-content: end; }

  .field-label { font-size: 10px; color: #888; margin-bottom: 5px; font-family: 'DM Mono', monospace; }

  .stepper { display: flex; align-items: center; }
  .step-btn { width: 38px; height: 38px; border: 0.5px solid #ccc; background: #faf9f7; color: #1a1a1a; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; user-select: none; }
  .step-btn:first-child { border-radius: 7px 0 0 7px; }
  .step-btn:last-child { border-radius: 0 7px 7px 0; }
  .step-btn:active { background: #f0ede8; }
  .step-val { min-width: 38px; height: 38px; border-top: 0.5px solid #ccc; border-bottom: 0.5px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500; background: #fff; color: #1a1a1a; font-family: 'DM Mono', monospace; }

  .total-row { display: flex; align-items: center; justify-content: space-between; }
  .total-label { font-size: 13px; color: #555; }

  .bid-inner { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  .bid-qty { flex-shrink: 0; }
  .bid-faces { flex-shrink: 0; }

  .verdict-card { border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .verdict-good { background: #EAF3DE; border: 0.5px solid #97C459; }
  .verdict-risky { background: #FAEEDA; border: 0.5px solid #EF9F27; }
  .verdict-bad { background: #FCEBEB; border: 0.5px solid #F09595; }
  .verdict-title { font-size: 15px; font-weight: 500; margin-bottom: 1px; }
  .verdict-good .verdict-title { color: #27500A; }
  .verdict-risky .verdict-title { color: #633806; }
  .verdict-bad .verdict-title { color: #791F1F; }
  .verdict-sub { font-size: 12px; }
  .verdict-good .verdict-sub { color: #3B6D11; }
  .verdict-risky .verdict-sub { color: #854F0B; }
  .verdict-bad .verdict-sub { color: #A32D2D; }

  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .stat { background: #fff; border: 0.5px solid #ccc; border-radius: 7px; padding: 8px 10px; }
  .stat-label { font-size: 10px; color: #aaa; margin-bottom: 2px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .06em; }
  .stat-val { font-size: 22px; font-weight: 500; color: #1a1a1a; font-family: 'DM Mono', monospace; }
  .bar-wrap { height: 3px; background: #f0ede8; border-radius: 2px; overflow: hidden; margin-top: 5px; }
  .bar { height: 100%; border-radius: 2px; transition: width .35s ease; }

  .raise-box { background: #fff; border: 0.5px solid #ccc; border-radius: 7px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; }
  .raise-left { display: flex; align-items: center; gap: 8px; flex: 1; }
  .raise-qty { font-size: 26px; font-weight: 500; color: #1a1a1a; font-family: 'DM Mono', monospace; line-height: 1; }
  .raise-x { font-size: 16px; color: #aaa; font-family: 'DM Mono', monospace; line-height: 1; }
  .raise-die { width: 40px; height: 40px; flex-shrink: 0; padding: 4px; border: 1px solid #bbb; border-radius: 7px; background: #faf9f7; }
  .raise-die svg { width: 100%; height: 100%; display: block; }
  .raise-label-small { font-size: 10px; color: #aaa; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
  .raise-pct { font-size: 26px; font-weight: 500; font-family: 'DM Mono', monospace; line-height: 1; }
  .raise-sub { font-size: 11px; color: #888; margin-top: 2px; }

  .settings-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding: 4px 0 8px; }
  .back-btn { background: none; border: 0.5px solid #ccc; border-radius: 7px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #888; flex-shrink: 0; }
  .back-btn:active { background: #f0ede8; }
  .settings-title { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 500; color: #1a1a1a; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 0.5px solid #ccc; }
  .setting-row:last-child { border-bottom: none; }
  .setting-label { font-size: 14px; color: #1a1a1a; }
  .setting-sub { font-size: 11px; color: #aaa; margin-top: 2px; }
</style>
</head>
<body>
<div class="app">

  <!-- Main screen -->
  <div class="screen" id="main-screen">
    <header>
      <div class="header-spacer"></div>
      <div class="header-center">
        <svg width="130" height="34" viewBox="0 0 130 34" xmlns="http://www.w3.org/2000/svg">
          <!-- L -->
          <circle cx="4" cy="3" r="2.4" fill="#1a1a1a"/>
          <circle cx="4" cy="9" r="2.4" fill="#1a1a1a"/>
          <circle cx="4" cy="15" r="2.4" fill="#1a1a1a"/>
          <circle cx="4" cy="21" r="2.4" fill="#1a1a1a"/>
          <circle cx="4" cy="27" r="2.4" fill="#1a1a1a"/>
          <circle cx="10" cy="27" r="2.4" fill="#1a1a1a"/>
          <circle cx="16" cy="27" r="2.4" fill="#1a1a1a"/>
          <circle cx="22" cy="27" r="2.4" fill="#1a1a1a"/>
          <!-- I -->
          <circle cx="34" cy="3" r="2.4" fill="#1a1a1a"/>
          <circle cx="40" cy="3" r="2.4" fill="#1a1a1a"/>
          <circle cx="46" cy="3" r="2.4" fill="#1a1a1a"/>
          <circle cx="40" cy="9" r="2.4" fill="#1a1a1a"/>
          <circle cx="40" cy="15" r="2.4" fill="#1a1a1a"/>
          <circle cx="40" cy="21" r="2.4" fill="#1a1a1a"/>
          <circle cx="34" cy="27" r="2.4" fill="#1a1a1a"/>
          <circle cx="40" cy="27" r="2.4" fill="#1a1a1a"/>
          <circle cx="46" cy="27" r="2.4" fill="#1a1a1a"/>
          <!-- A -->
          <circle cx="58" cy="3" r="2.4" fill="#1a1a1a"/>
          <circle cx="64" cy="3" r="2.4" fill="#1a1a1a"/>
          <circle cx="70" cy="3" r="2.4" fill="#1a1a1a"/>
          <circle cx="56" cy="9" r="2.4" fill="#1a1a1a"/>
          <circle cx="72" cy="9" r="2.4" fill="#1a1a1a"/>
          <circle cx="56" cy="15" r="2.4" fill="#1a1a1a"/>
          <circle cx="64" cy="15" r="2.4" fill="#1a1a1a"/>
          <circle cx="72" cy="15" r="2.4" fill="#1a1a1a"/>
          <circle cx="56" cy="21" r="2.4" fill="#1a1a1a"/>
          <circle cx="72" cy="21" r="2.4" fill="#1a1a1a"/>
          <circle cx="56" cy="27" r="2.4" fill="#1a1a1a"/>
          <circle cx="72" cy="27" r="2.4" fill="#1a1a1a"/>
          <!-- R -->
          <circle cx="84" cy="3" r="2.4" fill="#1a1a1a"/>
          <circle cx="90" cy="3" r="2.4" fill="#1a1a1a"/>
          <circle cx="96" cy="3" r="2.4" fill="#1a1a1a"/>
          <circle cx="84" cy="9" r="2.4" fill="#1a1a1a"/>
          <circle cx="98" cy="9" r="2.4" fill="#1a1a1a"/>
          <circle cx="84" cy="15" r="2.4" fill="#1a1a1a"/>
          <circle cx="90" cy="15" r="2.4" fill="#1a1a1a"/>
          <circle cx="96" cy="15" r="2.4" fill="#1a1a1a"/>
          <circle cx="84" cy="21" r="2.4" fill="#1a1a1a"/>
          <circle cx="94" cy="21" r="2.4" fill="#1a1a1a"/>
          <circle cx="84" cy="27" r="2.4" fill="#1a1a1a"/>
          <circle cx="100" cy="27" r="2.4" fill="#1a1a1a"/>
        </svg>
      </div>
      <button class="settings-btn" onclick="showSettings()" aria-label="Settings">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="8" cy="8" r="2.5"/>
          <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.05 3.05l1.06 1.06M11.89 11.89l1.06 1.06M3.05 12.95l1.06-1.06M11.89 4.11l1.06-1.06"/>
        </svg>
      </button>
    </header>

    <div class="card">
      <div class="card-label">My dice — tap to cycle</div>
      <div class="die-row" id="dice-row"></div>
    </div>

    <div class="card">
      <div class="total-row">
        <div class="total-label">Total dice in play</div>
        <div class="stepper">
          <button class="step-btn" onclick="adj('total',-1)">−</button>
          <div class="step-val" id="total-val">20</div>
          <button class="step-btn" onclick="adj('total',1)">+</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Current bid</div>
      <div class="bid-inner">
        <div class="bid-qty">
          <div class="field-label">Quantity</div>
          <div class="stepper">
            <button class="step-btn" onclick="adj('qty',-1)">−</button>
            <div class="step-val" id="qty-val">4</div>
            <button class="step-btn" onclick="adj('qty',1)">+</button>
          </div>
        </div>
        <div class="bid-faces">
          <div class="field-label" style="text-align:right;">Face</div>
          <div class="face-grid" id="bid-face-row"></div>
        </div>
      </div>
    </div>

    <div id="result-area"></div>
  </div>

  <!-- Settings screen -->
  <div class="screen hidden" id="settings-screen">
    <div class="settings-header">
      <button class="back-btn" onclick="showMain()" aria-label="Back">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 3L5 8l5 5"/>
        </svg>
      </button>
      <div class="settings-title">Settings</div>
    </div>
    <div class="card">
      <div class="setting-row">
        <div>
          <div class="setting-label">My dice count</div>
          <div class="setting-sub">How many dice you're rolling</div>
        </div>
        <div class="stepper">
          <button class="step-btn" onclick="adjDice(-1)">−</button>
          <div class="step-val" id="dice-count-val">6</div>
          <button class="step-btn" onclick="adjDice(1)">+</button>
        </div>
      </div>
    </div>
  </div>

</div>
<script>
const DOT_R = 11;
const DOTS = {
  1: [[50,50]],
  2: [[28,28],[72,72]],
  3: [[28,28],[50,50],[72,72]],
  4: [[28,28],[72,28],[28,72],[72,72]],
  5: [[28,28],[72,28],[50,50],[28,72],[72,72]],
  6: [[28,28],[72,28],[28,50],[72,50],[28,72],[72,72]]
};

function diceSVG(n, c='#1a1a1a') {
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${DOTS[n].map(([cx,cy]) => `<circle cx="${cx}" cy="${cy}" r="${DOT_R}" fill="${c}"/>`).join('')}</svg>`;
}

let myDice = [1,1,1,1,1,1];
let total = 20, bidQty = 4, bidFace = 3;

function showSettings() {
  document.getElementById('main-screen').classList.add('hidden');
  document.getElementById('settings-screen').classList.remove('hidden');
}

function showMain() {
  document.getElementById('settings-screen').classList.add('hidden');
  document.getElementById('main-screen').classList.remove('hidden');
}

function adjDice(d) {
  const n = Math.max(1, Math.min(6, myDice.length + d));
  while (myDice.length < n) myDice.push(1);
  myDice = myDice.slice(0, n);
  if (total < myDice.length) total = myDice.length;
  document.getElementById('dice-count-val').textContent = myDice.length;
  document.getElementById('total-val').textContent = total;
  renderDice(); calc();
}

function renderDice() {
  const row = document.getElementById('dice-row');
  row.innerHTML = '';
  myDice.forEach((v, i) => {
    const d = document.createElement('div');
    d.className = 'die';
    d.innerHTML = diceSVG(v);
    d.onclick = () => { myDice[i] = (myDice[i] % 6) + 1; renderDice(); calc(); };
    row.appendChild(d);
  });
}

function adj(k, d) {
  if (k === 'total') { total = Math.max(myDice.length, Math.min(30, total + d)); document.getElementById('total-val').textContent = total; }
  if (k === 'qty') { bidQty = Math.max(1, Math.min(30, bidQty + d)); document.getElementById('qty-val').textContent = bidQty; }
  calc();
}

function buildFaceRow() {
  const row = document.getElementById('bid-face-row');
  row.innerHTML = '';
  for (let f = 1; f <= 6; f++) {
    const b = document.createElement('div');
    b.className = 'face-btn' + (f === bidFace ? ' active' : '');
    b.innerHTML = diceSVG(f, f === bidFace ? '#185FA5' : '#1a1a1a');
    b.onclick = () => { bidFace = f; buildFaceRow(); calc(); };
    row.appendChild(b);
  }
}

function binom(n, k, p) {
  if (k > n || k < 0) return 0;
  if (p <= 0) return k === 0 ? 1 : 0;
  if (p >= 1) return 1;
  let log = 0;
  for (let i = 0; i < k; i++) log += Math.log(n - i) - Math.log(i + 1);
  log += k * Math.log(p) + (n - k) * Math.log(1 - p);
  return Math.exp(log);
}

function probAtLeast(n, k, p) {
  if (k <= 0) return 1;
  if (k > n) return 0;
  let t = 0;
  for (let i = k; i <= n; i++) t += binom(n, i, p);
  return Math.min(1, Math.max(0, t));
}

function bestRaise(unknown, currentQty, currentFace) {
  const candidates = [];
  for (let f = 1; f <= 6; f++) {
    const p = f === 1 ? 1/6 : 2/6;
    const mc = myDice.filter(v => v === f || v === 1).length;
    if (f === currentFace) {
      const q = currentQty + 1;
      candidates.push({ qty: q, face: f, prob: probAtLeast(unknown, Math.max(0, q - mc), p) });
    }
    if (f > currentFace) {
      candidates.push({ qty: currentQty, face: f, prob: probAtLeast(unknown, Math.max(0, currentQty - mc), p) });
    }
  }
  const safe = candidates.filter(c => c.prob >= 0.45);
  const pool = safe.length ? safe : candidates;
  return pool.reduce((a, b) => b.prob > a.prob ? b : a);
}

function calc() {
  const unknown = Math.max(0, total - myDice.length);
  const p = bidFace === 1 ? 1/6 : 2/6;
  const myCount = myDice.filter(v => v === bidFace || v === 1).length;
  const needed = Math.max(0, bidQty - myCount);
  const probTrue = probAtLeast(unknown, needed, p);
  const probLie = 1 - probTrue;

  let vClass, vTitle, vSub;
  if (probLie >= 0.55) { vClass = 'verdict-good'; vTitle = 'Call the bluff'; vSub = `${(probLie*100).toFixed(0)}% chance it's a lie`; }
  else if (probLie >= 0.38) { vClass = 'verdict-risky'; vTitle = 'Coin flip — your call'; vSub = `${(probLie*100).toFixed(0)}% chance it's a lie`; }
  else { vClass = 'verdict-bad'; vTitle = 'Let it ride'; vSub = `Only ${(probLie*100).toFixed(0)}% chance it's a lie`; }

  const rec = bestRaise(unknown, bidQty, bidFace);
  const pctColor = rec.prob >= 0.55 ? '#27500A' : rec.prob >= 0.35 ? '#633806' : '#791F1F';
  const recDesc = rec.prob >= 0.55 ? 'solid raise' : rec.prob >= 0.35 ? 'defensible bluff' : 'big bluff';

  document.getElementById('result-area').innerHTML = `
    <div class="verdict-card ${vClass}">
      <div class="verdict-title">${vTitle}</div>
      <div class="verdict-sub">${vSub}</div>
    </div>
    <div class="stats-row">
      <div class="stat"><div class="stat-label">Bid true</div><div class="stat-val">${(probTrue*100).toFixed(0)}%</div><div class="bar-wrap"><div class="bar" style="width:${(probTrue*100).toFixed(0)}%;background:#378ADD;"></div></div></div>
      <div class="stat"><div class="stat-label">Bid a lie</div><div class="stat-val">${(probLie*100).toFixed(0)}%</div><div class="bar-wrap"><div class="bar" style="width:${(probLie*100).toFixed(0)}%;background:#5a8f4e;"></div></div></div>
    </div>
    <div class="raise-box">
      <div class="raise-left">
        <div style="margin-right:2px;">
          <div class="raise-label-small">Raise to</div>
          <div class="raise-qty">${rec.qty}</div>
        </div>
        <div class="raise-x">×</div>
        <div class="raise-die">${diceSVG(rec.face)}</div>
      </div>
      <div style="text-align:right;">
        <div class="raise-label-small">true</div>
        <div class="raise-pct" style="color:${pctColor};">${(rec.prob*100).toFixed(0)}%</div>
        <div class="raise-sub">${recDesc}</div>
      </div>
    </div>`;
}

renderDice(); buildFaceRow(); calc();
</script>
</body>
</html>
